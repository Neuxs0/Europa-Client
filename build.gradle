plugins {
    id 'java-base'
    id 'com.github.johnrengelman.shadow' apply false
}

allprojects {
    apply plugin: 'java'
    group = rootProject.property('mod_group')
    version = rootProject.property('mod_version')
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    repositories {
        mavenLocal(); maven { url = 'https://maven.fabricmc.net/' }; maven { url "https://jitpack.io" }
        maven { url = 'https://maven.quiltmc.org/repository/release/' }; maven { url = 'https://repo.spongepowered.org/maven/' }
        mavenCentral()
        maven { name = "CRModders"; url = "https://maven.codeberg.org/api/v1/groups/CRModders/-/packages/maven" }
        maven { name = "Puzzle"; url = "https://maven.puzzlemc.org/repository/maven-public/" }
        ivy {
            name "Cosmic Reach"; url "https://github.com/CRModders/CosmicArchive/raw/main/versions"
            patternLayout { artifact "[classifier]/[revision]/client/Cosmic-Reach-[revision].jar" }
            metadataSources { artifact() }; content { includeModule "finalforeach", "cosmicreach" }
        }
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
}

tasks.register('baseUniversalJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    description = 'Builds a universal JAR for the base client variant.'
    group = 'build'
    dependsOn project(':src:base:common').jar
    dependsOn project(':src:base:puzzle').processResources, project(':src:base:puzzle').classes
    dependsOn project(':src:base:quilt').processResources, project(':src:base:quilt').classes

    archiveBaseName = rootProject.property('mod_name').replace(' ', '_')
    archiveVersion = rootProject.property('mod_version')
    archiveClassifier = 'base-universal' // Combined classifier

    // Explicitly include base variant components
    from project(':src:base:common').sourceSets.main.output.classesDirs // Base Common Classes
    from project(':src:base:common').sourceSets.main.resources           // Base Common Resources
    from project(':src:base:puzzle').sourceSets.main.output.classesDirs  // Base Puzzle Classes
    from project(':src:base:quilt').sourceSets.main.output.classesDirs   // Base Quilt Classes

    // Include processed metadata from platform projects
    from(project(':src:base:puzzle').tasks.named('processResources').map { it.destinationDir }) { include 'puzzle.mod.json', '*.manipulator' }
    from(project(':src:base:quilt').tasks.named('processResources').map { it.destinationDir }) { include 'quilt.mod.json' }

    manifest { attributes('MixinConfigs': "${rootProject.property('mod_id')}.mixins.json") }
    mergeServiceFiles()
}

tasks.register('cheatUniversalJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    description = 'Builds a universal JAR for the cheat client variant.'
    group = 'build'
    dependsOn project(':src:cheat:common').jar
    dependsOn project(':src:cheat:puzzle').processResources, project(':src:cheat:puzzle').classes
    dependsOn project(':src:cheat:quilt').processResources, project(':src:cheat:quilt').classes

    archiveBaseName = rootProject.property('mod_name').replace(' ', '_')
    archiveVersion = rootProject.property('mod_version')
    archiveClassifier = 'cheat-universal' // Combined classifier

    // Explicitly include cheat variant components
    from project(':src:cheat:common').sourceSets.main.output.classesDirs // Cheat Common Classes
    from project(':src:cheat:common').sourceSets.main.resources           // Cheat Common Resources
    from project(':src:cheat:puzzle').sourceSets.main.output.classesDirs  // Cheat Puzzle Classes
    from project(':src:cheat:quilt').sourceSets.main.output.classesDirs   // Cheat Quilt Classes

    // Include processed metadata from platform projects
    from(project(':src:cheat:puzzle').tasks.named('processResources').map { it.destinationDir }) { include 'puzzle.mod.json', '*.manipulator' }
    from(project(':src:cheat:quilt').tasks.named('processResources').map { it.destinationDir }) { include 'quilt.mod.json' }

    manifest { attributes('MixinConfigs': "${rootProject.property('mod_id')}.mixins.json") }
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn baseUniversalJar, project(':src:base:puzzle').tasks.named('shadowJar'), project(':src:base:quilt').tasks.named('jar')
    dependsOn cheatUniversalJar, project(':src:cheat:puzzle').tasks.named('shadowJar'), project(':src:cheat:quilt').tasks.named('jar')
}

tasks.register('cleanDist', Delete) { delete file('dist') }
tasks.named('clean') { dependsOn cleanDist }