plugins {
    id "java-base"
}

allprojects {
    group = rootProject.property("group")
    version = rootProject.property("version")
}

subprojects {
    apply plugin: "java"
    repositories {
        maven {
            name "JitPack"
            url "https://jitpack.io"
        }
    }
}

def mod_id = rootProject.property("id")
def mod_version = rootProject.property("version")

task cleanDist(type: Delete) {
    delete file("dist")
}

def requiredProjects = [
        project(":base:puzzle"), project(":base:quilt"),
        project(":cheat:puzzle"), project(":cheat:quilt")
]

def bypassPuzzleProject = project.findProject(':bypass:puzzle')
def bypassQuiltProject = project.findProject(':bypass:quilt')

def allProjectsToPackage = new ArrayList<>(requiredProjects)
if (bypassPuzzleProject) {
    allProjectsToPackage.add(bypassPuzzleProject)
    println "Will package bypass-puzzle JAR"
}
if (bypassQuiltProject) {
    allProjectsToPackage.add(bypassQuiltProject)
    println "Will package bypass-quilt JAR"
}

task packageDist {
    allProjectsToPackage.each { p ->
        dependsOn p.tasks.jar
    }

    dependsOn cleanDist
    outputs.dir file("dist")

    doLast {
        def distDir = file("dist")
        distDir.mkdirs()

        allProjectsToPackage.each { p ->
            def sourceJarFile = p.tasks.jar.archiveFile.get().asFile
            if (sourceJarFile.exists()) {
                copy {
                    from sourceJarFile
                    into distDir
                }
                logger.lifecycle("Copied ${sourceJarFile.name} to ${distDir.path}")
            } else {
                logger.warn("Source JAR not found for ${p.name}, skipped copying: ${sourceJarFile.path}")
            }
        }
    }
}

task cleanBuildDirs() {
    doLast {
        subprojects.each { subproject ->
            def buildDir = subproject.buildDir
            if (buildDir.exists()) {
                if (buildDir.deleteDir()) {
                    logger.lifecycle("Deleted build directory for ${subproject.name}: ${buildDir.path}")
                } else {
                    logger.error(
                            "Unable to delete build directory for ${subproject.name}: ${buildDir.path}"
                    )
                }
            }
        }

        def extraFolders = [
                // Base paths
                "base/build", "base/common/build", "base/common/bin",
                "base/puzzle/build", "base/puzzle/.gradle",
                "base/quilt/build", "base/quilt/bin",
                // Cheat paths
                "cheat/build", "cheat/common/build", "cheat/common/bin",
                "cheat/puzzle/build", "cheat/puzzle/.gradle",
                "cheat/quilt/build", "cheat/quilt/bin",
        ]

        if (file('bypass').isDirectory()) {
            extraFolders.addAll([
                    "bypass/build", "bypass/common/build", "bypass/common/bin",
                    "bypass/puzzle/build", "bypass/puzzle/.gradle",
                    "bypass/quilt/build", "bypass/quilt/bin"
            ])
        }

        // Delete the extra folders
        extraFolders.each { folderPath ->
            def folder = file(folderPath)
            if (folder.exists()) {
                int attempts = 0
                boolean deletedSuccessfully = false
                while (attempts < 5 && !deletedSuccessfully) {
                    attempts++
                    try {
                        deletedSuccessfully = delete(folder)
                        if (deletedSuccessfully) {
                            logger.lifecycle("Deleted folder: ${folder.path}")
                        } else if (folder.exists()) {
                            logger.lifecycle("Attempt ${attempts}: Gradle delete failed for ${folder.path}, trying deleteDir()...")
                            deletedSuccessfully = folder.deleteDir()
                            if (deletedSuccessfully) {
                                logger.lifecycle("Deleted folder with deleteDir(): ${folder.path}")
                            }
                        }
                    } catch (Exception e) {
                        logger.warn("Attempt ${attempts}: Exception during deletion of ${folder.path}: ${e.message}")
                        Thread.sleep(500)
                    }

                    if (!deletedSuccessfully && folder.exists() && attempts < 5) {
                        logger.warn("Attempt ${attempts} failed for ${folder.path}. Retrying...")
                        Thread.sleep(500)
                    }
                }
                if (!deletedSuccessfully && folder.exists()) {
                    logger.error(
                            "ERROR: Could not delete folder: ${folder.path} after ${attempts} attempts. It might be locked."
                    )
                } else if (!folder.exists() && !deletedSuccessfully && attempts > 0){
                    logger.lifecycle("Folder ${folder.path} no longer exists (possibly deleted).")
                }
            }
        }
    }
}


tasks.named("build") {
    dependsOn packageDist
    finalizedBy cleanBuildDirs
}

tasks.named("clean") {
    dependsOn cleanBuildDirs, cleanDist
}