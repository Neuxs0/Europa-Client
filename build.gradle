plugins {
    id 'java'
    id 'jigsaw-cosmic-reach'
}

group = mod_group
version = mod_version

java {
    toolchain { languageVersion = JavaLanguageVersion.of(24) }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url "https://jitpack.io" }
    maven { url = 'https://maven.puzzleshq.dev/releases/' }
    maven { url = 'https://maven.puzzleshq.dev/snapshots/' }
}

def localGameJars = files(
    "dev/cosmic-reach-client-${cosmic_reach_version}.jar",
    "dev/cosmic-reach-server-${cosmic_reach_version}.jar"
)

def puzzleApiJars = [
    "dev.puzzleshq:puzzle-loader-core:${puzzle_loader_core_version}:common",
    "dev.puzzleshq:puzzle-loader-core:${puzzle_loader_core_version}:client",
    "net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7"
]

// 1. Define Dependencies on the standard 'implementation' configuration
dependencies {
    puzzleLoader "dev.puzzleshq:puzzle-loader-core:${puzzle_loader_core_version}"
    puzzleLoader "dev.puzzleshq:puzzle-loader-cosmic:${puzzle_loader_cosmic_version}"
    cosmicReach "finalforeach:cosmic-reach:${cosmic_reach_version}"
    
    // Core libs
    implementation 'com.google.code.gson:gson:2.10.1'
}

// 2. Define Custom SourceSets
sourceSets {
    base {
        java.srcDirs = ['src/base/java']
        resources.srcDirs = ['src/base/resources']
    }
    cheat {
        java.srcDirs = ['src/cheat/java']
        resources.srcDirs = ['src/cheat/resources']
    }
}

// 3. THE FIX: Use 'afterEvaluate' to copy classpath LATE
// We wait for Jigsaw to finish setting up 'main', then we steal its classpath.
afterEvaluate {
    // Fix Compile Classpath (fixes "package does not exist")
    sourceSets.base.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    sourceSets.cheat.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath

    // Fix Runtime Classpath (fixes running the client)
    sourceSets.base.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    sourceSets.cheat.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}

// 4. Jigsaw Configuration
jigsawGame {
    splitSourceSets()
}

jigsawInject {
    // Inject the Cheat version for standard './gradlew runClient'
    setModJson(file("src/cheat/resources/puzzle.mod.json"))
}

// 5. Metadata Expansion
def puzzleModExpandProps = [
    "mod_version": mod_version,
    "mod_id": mod_id,
    "mod_name": mod_name,
    "mod_description": mod_description,
    "mod_group": mod_group,
    "mod_license": mod_license,
    "mod_author": mod_author,
    "cosmic_reach_dependency": cosmic_reach_dependency,
    "puzzle_loader_cosmic_version": puzzle_loader_cosmic_version
]

tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
    inputs.properties puzzleModExpandProps
    filesMatching("*.json") { expand puzzleModExpandProps }
}

// 6. Jar Tasks
tasks.register('baseJar', Jar) {
    group = 'build'
    description = 'Assembles the Base (No-Cheat) client jar.'
    archiveClassifier.set('base')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from sourceSets.main.output
    from sourceSets.base.output
}

tasks.register('cheatJar', Jar) {
    group = 'build'
    description = 'Assembles the Cheat client jar.'
    archiveClassifier.set('cheat')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from sourceSets.main.output
    from sourceSets.cheat.output
}

// 7. Ensure dependencies are hooked up for running
dependencies {
    runtimeOnly sourceSets.main.output
    runtimeOnly sourceSets.cheat.output
    compileOnly localGameJars
    runtimeOnly localGameJars
    compileOnly puzzleApiJars
    baseCompileOnly localGameJars
    baseRuntimeOnly localGameJars
    baseCompileOnly puzzleApiJars
    cheatCompileOnly localGameJars
    cheatRuntimeOnly localGameJars
    cheatCompileOnly puzzleApiJars
}

tasks.named('build') {
    dependsOn tasks.named('baseJar')
    dependsOn tasks.named('cheatJar')
}
